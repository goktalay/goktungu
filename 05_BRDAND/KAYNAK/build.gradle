// GOKTUNGU MAVLink Koprusu -- kok Gradle yapilandirmasi
//
// AGP / Gradle / JDK ucluSu birlikte degistirilmelidir; uyusmazlik en
// sik gorulen derleme kusurudur.  Bu surumler DJI koprusunde
// dogrulanmis birlesimden devralindi.

buildscript {
    ext {
        agp_surum = '8.5.2'
        // DJI MSDK v5 gomuldugu icin Kotlin 2.1.0 yeniden ZORUNLU:
        // MSDK 5.18.0 Kotlin 2.1.0 metadata ile derlenmistir, daha
        // dusuk surum "incompatible version of Kotlin ... metadata is
        // 2.1.0" hatasi verir. Zaten dogrulanmis birlesim buydu.
        kotlin_surum = '2.1.0'
        // DJI MSDK surumu tek yerde tanimli; yukseltirken yalniz burayi
        // degistirmek yeterli olmali (BRDDJI ile ayni surum).
        msdk_surum = '5.18.0'
        // Play Store: 31 Agu 2026'dan SONRA yeni uygulamalar ve
        // guncellemeler API 36 (Android 16) hedeflemek ZORUNDA.
        hedef_sdk = 36
        derleme_sdk = 36
        // USB Host API cok eski surumlerde de var; en dusuk surum
        // `foregroundServiceType` ve modern izin akisina gore secildi.
        en_dusuk_sdk = 24
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_surum"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_surum"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
