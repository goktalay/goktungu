# Bellek: sandbox 3.8 GB RAM'e sahip; 1536m guvenli ust sinir.
# Daha yuksek deger derleme sirasinda OOM uretir.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# DJI MSDK buyuk oldugu icin Jetifier kapali tutulur (BRDDJI deseni).
android.enableJetifier=false

