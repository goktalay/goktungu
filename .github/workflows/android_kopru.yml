# GÖKTUNGU Android köprüsü (MAVLink) — APK derleme
#
# NEDEN GITHUB ACTIONS: merkez sunucu (OpenVZ) çekirdeği JVM güvenli-nokta
# sayfa hatasını SI_USER olarak bildiriyor; Gradle daemon'u "sent by kill"
# ile çöküyor (hs_err: si_code 0, si_pid 0). Uzun JVM işleri orada
# güvenilir değil. APK'lar burada derlenir, `android-apk` dalına yazılır;
# imzalama ve katalog yayını merkez sunucuda yapılır (anahtar deposu
# depoya girmez).
name: android-kopru
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "05_BRDAND/KAYNAK/**"
      - ".github/workflows/android_kopru.yml"
permissions:
  contents: write
concurrency:
  group: android-kopru
  cancel-in-progress: true
jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - proje: 05_BRDAND
            ad: GOKTUNGU-MAVLink-Koprusu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Derle (imzasız yayın APK'sı)
        working-directory: ${{ matrix.proje }}/KAYNAK
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/cikti"
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/cikti/${{ matrix.ad }}-gradle.log"
          S=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p "$GITHUB_WORKSPACE/cikti"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/cikti/${{ matrix.ad }}-${S}-unsigned.apk"
          ls -la "$GITHUB_WORKSPACE/cikti"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.ad }}
          path: |
            cikti/*.apk
            cikti/*.log
          retention-days: 30
  yaz:
    needs: derle
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: indirilen
      - name: android-apk dalına yaz
        run: |
          git config user.name "goktungu-actions"
          git config user.email "actions@goktungu.com"
          git checkout --orphan android-apk
          git rm -rfq . || true
          mkdir -p apk
          find indirilen -name "*.apk" -exec cp {} apk/ \;
          find indirilen -name "*.log" -exec cp {} apk/ \;
          rm -rf indirilen
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) main@${GITHUB_SHA} derle=${{ needs.derle.result }}" > apk/KAYNAK_SHA.txt
          ls -la apk
          git add apk
          git commit -qm "Android köprü APK'ları (imzasız) — main@${GITHUB_SHA::7}"
          git push -f origin android-apk
