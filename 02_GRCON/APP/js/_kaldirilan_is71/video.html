<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GÖKTUNGU — VİDEO</title>
<meta name="description" content="GÖKTUNGU video duvarı — çoklu kamera akışı ve yapay zekâ tespit katmanı.">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/stil.css?v=v24106">
<link rel="stylesheet" href="css/video_duvar.css?v=v24106">
</head>
<body>

<!-- UST BAR -->
<div id="ustBar">
  <div id="ustBarSol">
    <a id="vdAnaSayfa" href="index.html" data-i18n-title="ipKomutaDon" title="Komuta ekranına dön">
      <i class="fa-solid fa-map"></i><span data-i18n="vpKomuta">KOMUTA</span>
    </a>
  </div>
  <div id="ustBarOrta">
    <img id="logo" src="logo.png" alt="logo">
    <span class="baslik" data-i18n="vpBaslik">GÖKTUNGU VİDEO</span>
  </div>
  <div id="ustBarSag">
    <div id="vdYerlesimGrup" data-i18n-title="ipYerlesim" title="Yerleşim">
      <button data-yerlesim="1" data-i18n-title="vpTekKamera" title="Tek kamera"><i class="fa-solid fa-square"></i><span>1</span></button>
      <button data-yerlesim="2" data-i18n-title="vpIkiKamera" title="2 kamera"><i class="fa-solid fa-table-columns"></i><span>2</span></button>
      <button data-yerlesim="4" data-i18n-title="vpDortKamera" title="4 kamera"><i class="fa-solid fa-table-cells-large"></i><span>4</span></button>
      <button data-yerlesim="6" data-i18n-title="vpAltiKamera" title="6 kamera"><i class="fa-solid fa-table-cells"></i><span>6</span></button>
    </div>
    <button id="vdTamEkran" data-i18n-title="ipTamEkran" title="Tam Ekran"><i class="fa-solid fa-expand"></i></button>
  </div>
</div>

<!-- VIDEO IZGARASI -->
<div id="vdIzgara"></div>

<!-- ALT BAR -->
<div id="altBar">
  <!-- #vdWsDurum metni JS ile yazilir (video_duvar.js); ceviri
       window.videoDuvarDilTazele() ile yapilir. -->
  <span id="vdWsDurum" class="f-kotu" data-i18n="vpSunucuyaBaglaniliyor">Sunucuya bağlanılıyor...</span>
  <span id="vdOturumBilgi"></span>
  <span class="atif"><span data-i18n="vpAtif">KOMUTA KONTROL SİSTEMİ</span></span>
</div>

<!-- KAMERA DUZENLEME MODALI -->
<div id="vdModalPerde" class="popup-gizli">
  <div id="vdModalKutu">
    <div class="popup-baslik">
      <span><i class="fa-solid fa-video"></i> <span id="vdModalBaslik" data-i18n="vpKamerayiDuzenle">KAMERAYI DÜZENLE</span></span>
      <button id="vdModalKapat" data-i18n-title="ipKapat" title="Kapat"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="vd-modal-icerik">
      <label for="vdKamAd" data-i18n="lblKamAd">KAMERA ADI</label>
      <input type="text" id="vdKamAd" spellcheck="false" autocomplete="off">
      <label for="vdKamProt" data-i18n="lblKamProtokol">PROTOKOL</label>
      <select id="vdKamProt">
        <option value="rtsp">RTSP</option>
        <option value="rtp">RTP</option>
        <option value="mjpeg">MJPEG</option>
        <option value="hls">HLS</option>
        <option value="http" data-i18n="vpProtHttpMp4">HTTP (MP4/WebM)</option>
        <option value="donanim" data-i18n="vpProtDonanimUsb">DONANIM (USB)</option>
      </select>
      <div id="vdUrlSatir">
        <label for="vdKamUrl" data-i18n="lblKamUrl">YAYIN ADRESİ (URL)</label>
        <input type="text" id="vdKamUrl" spellcheck="false" autocomplete="off"
               data-i18n-ph="vpUrlYer" placeholder="rtsp://kullanici:sifre@ip:554/yol">
      </div>
      <div id="vdCihazSatir" class="gizli">
        <label for="vdCihazSec" data-i18n="lblKamCihaz">KAMERA CİHAZI</label>
        <select id="vdCihazSec"></select>
      </div>
      <div id="vdKamHata"></div>
      <div class="vd-modal-dugmeler">
        <button id="vdKamIptal" data-i18n="btnIptal">İPTAL</button>
        <button id="vdKamKaydet" class="birincil" data-i18n="btnKaydet">KAYDET</button>
      </div>
    </div>
  </div>
</div>

<!-- GIRIS PERDESI (index ile ayni gorsel dil) -->
<div id="girisPerde" class="popup-gizli">
  <div id="girisKutu">
    <img class="giris-logo" src="logo.png" alt="">
    <h1>G&Ouml;KTUNGU</h1>
    <div class="giris-alt"><span data-i18n="vpGirisAlt">V&#304;DEO DUVARI</span></div>
    <label for="girisEposta" data-i18n="lblGirisEposta">KULLANICI ADI (E-POSTA)</label>
    <input type="text" id="girisEposta" placeholder="ad.soyad@gokkubbetech.com" spellcheck="false" autocomplete="username">
    <label for="girisSifre" data-i18n="lblGirisSifre">&#350;&#304;FRE</label>
    <input type="password" id="girisSifre" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
    <label class="giris-hatirla" for="girisHatirla">
      <input type="checkbox" id="girisHatirla" checked>
      <span data-i18n="lblHatirla">Kullan&#305;c&#305; bilgilerini sakla</span>
    </label>
    <button id="btnGiris" data-i18n="btnGiris">G&#304;R&#304;&#350; YAP</button>
    <div id="girisHata"></div>
  </div>
</div>

<script src="lib/hls.min.js"></script>
<!-- v2.4.34: /video sayfasi artik ortak sozluge baglidir; i18n.js
     korumali baglama sayesinde dil dugmeleri olmayan sayfalarda da
     guvenle yuklenir ve `gcs_dil` secimini uygular. -->
<script src="js/i18n.js?v=v24106"></script>
<!-- v2.4.33: MJPEG dayanikli yukleme yardimcisi (video_duvar.js'ten ONCE) -->
<script src="js/mjpeg_yeniden.js?v=v24106"></script>
<script src="js/video_duvar.js?v=v24106"></script>
</body>
</html>
