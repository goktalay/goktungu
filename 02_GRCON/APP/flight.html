<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GÖKTUNGU — Uçuş Duvarı</title>
<meta name="description" content="GÖKTUNGU uçuş duvarı — çoklu hava aracı telemetrisi ve durum göstergeleri tam ekran görünümü.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<link rel="stylesheet" href="css/flight.css?v=v24106">
</head>
<body>

<div id="fwUst">
  <div class="fw-marka">
    <img class="fw-logo" src="logo.png" alt="GÖKTUNGU">
    <span class="fw-ad">GÖKTUNGU</span>
    <span class="fw-alt" data-i18n="ucusDuvariBaslik">UÇUŞ DUVARI</span>
  </div>

  <div class="fw-yerlesimler" id="fwYerlesimler">
    <button class="fw-yb" data-yer="1" data-i18n-title="ipYerlesim1" title="Tekli">
      <svg viewBox="0 0 24 16"><rect x="1" y="1" width="22" height="14"/></svg>
      <span>1</span>
    </button>
    <button class="fw-yb" data-yer="2" data-i18n-title="ipYerlesim2" title="İkili">
      <svg viewBox="0 0 24 16"><rect x="1" y="1" width="10.5" height="14"/><rect x="12.5" y="1" width="10.5" height="14"/></svg>
      <span>2</span>
    </button>
    <button class="fw-yb" data-yer="3" data-i18n-title="ipYerlesim3" title="Üçlü (solda tek, sağda iki)">
      <svg viewBox="0 0 24 16"><rect x="1" y="1" width="13" height="14"/><rect x="15" y="1" width="8" height="6.5"/><rect x="15" y="8.5" width="8" height="6.5"/></svg>
      <span>3</span>
    </button>
    <button class="fw-yb" data-yer="4" data-i18n-title="ipYerlesim4" title="Dörtlü">
      <svg viewBox="0 0 24 16"><rect x="1" y="1" width="10.5" height="6.5"/><rect x="12.5" y="1" width="10.5" height="6.5"/><rect x="1" y="8.5" width="10.5" height="6.5"/><rect x="12.5" y="8.5" width="10.5" height="6.5"/></svg>
      <span>4</span>
    </button>
    <button class="fw-yb" data-yer="5" data-i18n-title="ipYerlesim5" title="Beşli (solda tek, sağda dört)">
      <svg viewBox="0 0 24 16"><rect x="1" y="1" width="13" height="14"/><rect x="15" y="1" width="3.7" height="6.5"/><rect x="19.3" y="1" width="3.7" height="6.5"/><rect x="15" y="8.5" width="3.7" height="6.5"/><rect x="19.3" y="8.5" width="3.7" height="6.5"/></svg>
      <span>5</span>
    </button>
    <button class="fw-yb" data-yer="6" data-i18n-title="ipYerlesim6" title="Altılı">
      <svg viewBox="0 0 24 16"><rect x="1" y="1" width="6.8" height="6.5"/><rect x="8.6" y="1" width="6.8" height="6.5"/><rect x="16.2" y="1" width="6.8" height="6.5"/><rect x="1" y="8.5" width="6.8" height="6.5"/><rect x="8.6" y="8.5" width="6.8" height="6.5"/><rect x="16.2" y="8.5" width="6.8" height="6.5"/></svg>
      <span>6</span>
    </button>
  </div>

  <div class="fw-sag">
    <!-- Bu iki gosterge JS ile yazilir (flight.js: elDronSayi / elWsDurum);
         ilk deger yalnizca sayfa yuklenirken gorunur. Ceviri
         window.ucusDilTazele() ile yapilir. -->
    <span id="fwDronSayi" class="fw-sayac">0 DRON</span>
    <span id="fwWsDurum" class="fw-ws fw-ws-kopuk" data-i18n="ucusBaglaniyor">BAĞLANIYOR</span>
    <!-- v2.4.45: ikinci ekranda kullanim icin tam ekran. Ipucu ve ikon
         flight.js tarafindan (fwTamEkranTazele) guncellenir. -->
    <!-- FAZ18-IS25: gece/gunduz dugmesi. Ana uygulamada iki ayri
         dugme var (btnKoyu / btnAcik) ama ust cubuk burada dar oldugu
         icin tek gecisli dugme kullanilir; ikon duruma gore degisir.
         Tema tercihi sunucu tarafi kullanici ayarinda tutulur
         (tema.js:47-49 deseni), boylece TUM paneller ayni tercihi
         hatirlar. -->
    <button id="fwTema" class="fw-tam-btn"
            data-i18n-title="ucusTema" title="Gece / Gündüz">
      <svg viewBox="0 0 24 24" class="fw-tema-ay">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
      </svg>
      <svg viewBox="0 0 24 24" class="fw-tema-gunes">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
    <button id="fwTamEkran" class="fw-tam-btn"
            data-i18n-title="ucusTamEkran" title="Tam ekran (F)">
      <svg viewBox="0 0 24 24" class="fw-tam-ac">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      <svg viewBox="0 0 24 24" class="fw-tam-kapa">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
  </div>
</div>

<div id="fwIzgara" class="fw-yer-6"></div>

<!-- v2.4.34: /flight sayfasi artik ortak sozluge baglidir. i18n.js
     korumali baglama ile her sayfada guvenle yuklenir ve `gcs_dil`
     localStorage anahtarindaki secim burada da uygulanir. -->
<script src="js/i18n.js?v=v24106"></script>
<script src="js/flight_pfd.js?v=v24106"></script>
<script src="js/flight.js?v=v24106"></script>
</body>
</html>
