// GRCOFFANDR — GÖKTUNGU GRCOFF Android (gömülü tam uygulama)
//
// Mimari:
//   - Chaquopy: GRCOFF Python arka ucu (goktungu paketi) APK içinde,
//     Python 3.11 yorumlayıcısı ile gömülü çalışır.
//   - WebView: mevcut GRCOFF web arayüzü (Cesium harita + panel_pfd + JS)
//     yerel bir HTTP sunucusu üzerinden gösterilir.
//   - SQLite: PostgreSQL yerine cihaz-içi veri deposu (arka uç portu).
//
// Chaquopy native Python içerdiği için ABI süzgeci ZORUNLUdur; aksi
// halde APK tüm mimarilerin .so'larını taşıyıp devasa olur.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Gömülü Python (Chaquopy) — arka ucu APK'ye derler.
    id 'com.chaquo.python'
}

// DJI API anahtari yapilandirmadan okunur (Faz 4). Anahtar uygulama
// PAKET ADINA (com.turkbey.goktungu) baglidir ve DJI Developer
// hesabindan alinir; kaynak depoya gomulemez. Sirasiyla su yerlere
// bakilir:
//   1. yerel.properties -> dji.api.anahtari
//   2. cevre degiskeni  -> DJI_API_ANAHTARI
// Ikisi de yoksa bos kalir; uygulama calisir ama SDK kaydi basarisiz
// olur ve gunluk bunu acikca bildirir (sessiz cokme YOK). NOT: anahtar
// icerigi burada OKUNMAZ/LOGLANMAZ; yalniz manifestPlaceholders'a gecer.
def djiAnahtar = ""
def yerelDosya = rootProject.file("yerel.properties")
if (yerelDosya.exists()) {
    def p = new Properties()
    yerelDosya.withInputStream { p.load(it) }
    djiAnahtar = p.getProperty("dji.api.anahtari", "")
}
if (djiAnahtar?.isEmpty()) {
    djiAnahtar = System.getenv("DJI_API_ANAHTARI") ?: ""
}

android {
    // Bayrak ürün: tam GÖKTUNGU uygulaması Play Store'da com.turkbey.goktungu
    // kimliğini taşır. DJI köprüsü com.turkbey.goktungu.dji'ye, MAVLink
    // köprüsü com.turkbey.goktungumav'a ayrılır (çakışma önlenir).
    namespace 'com.turkbey.goktungu'
    compileSdk rootProject.ext.derleme_sdk

    defaultConfig {
        applicationId 'com.turkbey.goktungu'
        minSdk rootProject.ext.en_dusuk_sdk
        targetSdk rootProject.ext.hedef_sdk
        versionCode 18
        versionName '0.2.7'

        // DJI MSDK cok buyuk -> multidex ZORUNLU (Chaquopy dex'i ile
        // birlikte 64K metod sinirini asar). MultiDex.install
        // GoktunguUygulama.attachBaseContext icinde cagrilir.
        multiDexEnabled true

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // ABI SUZGECI (Faz 4): arm64-v8a + armeabi-v7a'ya DARALTILDI.
        //
        // OLCULDU (dji-sdk-v5-aircraft-5.18.0.aar jni/):
        //   arm64-v8a  : ~257 MB (tam ucus denetimi)
        //   armeabi-v7a: ~26 MB  (tam ucus denetimi)
        //   x86 / x86_64: yalniz birkac yardimci .so; UCUS DENETIMI YOK
        //     -> oykunucude DJI ucusu ZATEN CALISMAZ (gercek gercekleme degil).
        //
        // DIKKAT — CHAQUOPY BAGI: Chaquopy'nin `python { }` ABI kumesi
        // `ndk.abiFilters`'i TAKIP EDER. Yani x86/x86_64 buradan cikinca
        // gomulu PYTHON da o mimariler icin paketlenmez. SONUC: bu APK
        // artik x86/x86_64 OYKUNUCULARDA calismaz (hem MSDK hem Python
        // kaybi). Gerekce: (1) DJI ucusu oykunucude zaten imkansiz;
        // (2) x86 ABI'lerini eklemek APK'yi buyutur ve MSDK .so'lari
        // orada islevsel degil. Gercek cihaz (arm) hedeflenir; urun
        // yalniz-tablet (>=600dp) zaten sahada arm cihazdir.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // DJI API anahtari manifest'e (com.dji.sdk.API_KEY) buradan gecer.
        manifestPlaceholders = [
            DJI_API_ANAHTARI: djiAnahtar
        ]

        python {
            // OpenJ9 kutusunda derleme yapan Python 3.11.
            buildPython "/usr/bin/python3.11"
            version "3.11"
            pip {
                // GRCOFF arka ucunun bağımlılıkları.
                //   numpy  : Chaquopy'nin önceden derlenmiş tekeri (arm64...)
                //   pyserial: saf Python
                //   pymavlink: --no-deps ile kurulur. Aksi halde `fastcrc`
                //     (Rust) ve `lxml` (C) çekilir; Chaquopy yerel kod
                //     DERLEYEMEZ. İkisi de çalışma anında ZORUNLU DEĞİL:
                //     fastcrc koşullu (saf-Python CRC yedeği var), lxml
                //     yalnız DataFlash log ayrıştırma + dialect üretiminde
                //     tembel kullanılır. Çekirdek MAVLink (mavutil, dialects)
                //     bunlarsız çalışır.
                options "--no-deps"
                install "pyserial"
                // pymavlink C uzantısı (dfindexer) PYMAVLINK_FAST_INDEX=0
                // ile atlanır (derleme betiğinde -e ile verilir); Chaquopy
                // yerel kod derleyemez. Saf-Python indeksleyici yedeği var.
                install "pymavlink==2.4.49"
                install "numpy"
                // numpy'nin native bağımlılıkları (Requires-Dist:
                // chaquopy-openblas, chaquopy-libcxx) --no-deps yüzünden
                // atlanıyordu → çalışma anında `libopenblas.so bulunamadı`.
                // Bu yüzden AÇIKÇA eklenir (libopenblas.so + libc++ sağlar).
                install "chaquopy-openblas"
                install "chaquopy-libcxx"
                // openblas Fortran ile derli → libgfortran.so.3 gerekir.
                // chaquopy-openblas'ın Requires-Dist'i; --no-deps yüzünden
                // atlanıyordu (zincir: numpy → openblas → libgfortran).
                install "chaquopy-libgfortran"
                // WebSocket sunucusu (arayüz iletişimi) — ZORUNLU. İsteğe
                // bağlı C hızlandırması (speedups) optional=True olduğundan
                // Chaquopy derleyemese de kurulum sürer (saf-Python yedeği).
                install "websockets==17.0.1"
            }
            // Arka uç açılışta modül olarak başlatılır.
            pyc {
                src false
            }
        }
    }

    signingConfigs {
        release {
            def imzaDosya = rootProject.file("imza.properties")
            if (imzaDosya.exists()) {
                def p = new Properties()
                imzaDosya.withInputStream { p.load(it) }
                storeFile rootProject.file(p.getProperty("anahtar.deposu"))
                storePassword p.getProperty("depo.sifresi")
                keyAlias p.getProperty("anahtar.adi")
                keyPassword p.getProperty("anahtar.sifresi")
            }
        }
    }

    buildTypes {
        release {
            // Chaquopy + WebView JS köprüsü için R8 kapalı (yansıma
            // ve JS arayüz sınıfları korunmalı; DJI köprüsünde de
            // R8 kapalıydı).
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'), 'proguard-rules.pro'
            def imzaDosya = rootProject.file("imza.properties")
            if (imzaDosya.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.hata'
            versionNameSuffix '-hata'
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        // MSDK, Chaquopy (Python native) ve FFmpeg ayni yerel
        // kutuphaneleri tasiyabilir -> ilk bulunani al (cakisma cozumu).
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so', '**/libcrypto.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                'META-INF/NOTICE*', 'META-INF/*.kotlin_module',
                'META-INF/rxjava.properties'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def msdk = rootProject.ext.msdk_surum

    // --- DJI MSDK v5 (Faz 4) ---
    // aircraft   : ana denetim paketi (telemetri, ucus, waypoint)
    implementation "com.dji:dji-sdk-v5-aircraft:$msdk"
    // provided   : yalniz derleme arayuzleri (APK'ye girmez)
    compileOnly "com.dji:dji-sdk-v5-aircraft-provided:$msdk"
    // networkImp : DJI ag katmani. Koprumuz kendi TCP baglantisini kursa
    //   da bazi araclar ag katmani olmadan etkinlestirilemez ve uzaktan
    //   kimlik yukumlulukleri bunu gerektirir.
    runtimeOnly "com.dji:dji-sdk-v5-networkImp:$msdk"

    // --- Android temel ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    // MSDK + Chaquopy dex'i icin multidex (attachBaseContext'te kurulur).
    implementation 'androidx.multidex:multidex:2.0.1'

    // Eş zamanlılık
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
