# Bellek: sandbox 3.8 GB RAM'e sahip; 1536m guvenli ust sinir.
# Daha yuksek deger derleme sirasinda OOM uretir.
# -Xtrace:none: OpenJ9'un iç izleme (trace) motoru, D8/R8 dex birleştirme
# (mergeExtDex) iş yükü altında bir "traceassert" assertion'ı tetikleyip
# daemon JVM'ini düşürüyor (javacore ile doğrulandı; SIGSEGV değil, trace
# assertion). İzlemeyi kapatmak bu çökmeyi önler. Köprülerde Chaquopy
# sınıfları olmadığı için dex hacmi bu eşiğe ulaşmıyordu.
# JIT sorun değildi (-Xint ile de çöküyordu), bu yüzden JIT açık (hız).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Xtrace:none
# parallel KAPALI: tek modullu proje (parallel fayda vermez) ve Chaquopy
# eklentisi + in-process Kotlin derleyici ile birlikte "Current thread does
# not hold the state lock for root project" Gradle kilit hatasi uretir.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

